name: Release

# Push a tag such as v0.1.0 to build the packages (Windows, Linux, signed Android APK) and create a DRAFT release holding them.
on:
  push:
    tags:
      - "v*"

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
  VCPKG_DISABLE_METRICS: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-

      - name: Get vcpkg at the manifest baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg
          git -C $root fetch --depth 1 origin $baseline
          git -C $root checkout FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build (Release, MSVC, x64-windows-static)
        shell: pwsh
        run: .\build.ps1

      - name: Run the console tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem build\Release\calligrus-*-test.exe) {
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }

      - name: Package
        shell: pwsh
        run: |
          $name = "calligrus-${{ github.ref_name }}-windows-x64"
          $dir = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force "$dir\fonts" | Out-Null
          Copy-Item build\Release\calligrus.exe $dir
          Copy-Item LICENSE, THIRD-PARTY.md $dir
          Copy-Item assets\fonts\*.txt "$dir\fonts"
          Copy-Item editors "$dir\editors" -Recurse
          Compress-Archive -Path $dir -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: calligrus-*-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl zip unzip tar pkg-config autoconf autoconf-archive automake libtool \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev \
            libxkbcommon-dev libwayland-dev libxext-dev

      - name: Get vcpkg at the manifest baseline
        run: |
          mkdir -p .vcpkg-cache
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git init "$HOME/vcpkg"
          git -C "$HOME/vcpkg" remote add origin https://github.com/microsoft/vcpkg
          git -C "$HOME/vcpkg" fetch --depth 1 origin "$baseline"
          git -C "$HOME/vcpkg" checkout FETCH_HEAD
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Build (Release)
        run: bash build.sh

      - name: Run the console tests
        run: |
          fail=0
          for t in build/calligrus-*-test; do
            echo "== $t"
            "$t" || fail=1
          done
          exit $fail

      - name: Package
        run: |
          name="calligrus-${{ github.ref_name }}-linux-x64"
          mkdir -p "$name/fonts"
          cp build/calligrus LICENSE THIRD-PARTY.md "$name/"
          cp assets/fonts/*.txt "$name/fonts/"
          cp -r editors "$name/editors"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: calligrus-*-linux-x64.tar.gz

  # The signed arm64 APK. Without the signing secrets this job fails: a release must never carry an unsigned APK.
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Require the signing secrets
        env:
          HAS_KEY: ${{ secrets.CALLIGRUS_KEYSTORE_B64 != '' && secrets.CALLIGRUS_KEYSTORE_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::The Actions secrets CALLIGRUS_KEYSTORE_B64 and CALLIGRUS_KEYSTORE_PASSWORD are required to build the signed release APK."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Restore here, save right after the build (below): same as the CI job.
      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}
          restore-keys: vcpkg-android-

      - name: Install Android SDK packages
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build git curl zip unzip tar pkg-config autoconf autoconf-archive automake libtool

      - name: Get vcpkg at the manifest baseline
        run: |
          mkdir -p .vcpkg-cache
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git init "$HOME/vcpkg"
          git -C "$HOME/vcpkg" remote add origin https://github.com/microsoft/vcpkg
          git -C "$HOME/vcpkg" fetch --depth 1 origin "$baseline"
          git -C "$HOME/vcpkg" checkout FETCH_HEAD
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      # No `set -x` in the steps that touch the secrets.
      - name: Decode the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.CALLIGRUS_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/calligrus-release.jks"
          chmod 600 "$RUNNER_TEMP/calligrus-release.jks"

      # The signing variables exist for this one step only (not in GITHUB_ENV).
      - name: Build (Release, arm64-v8a, signed)
        working-directory: android
        env:
          CALLIGRUS_RELEASE_KEYSTORE: ${{ runner.temp }}/calligrus-release.jks
          CALLIGRUS_RELEASE_STORE_PASSWORD: ${{ secrets.CALLIGRUS_KEYSTORE_PASSWORD }}
          CALLIGRUS_RELEASE_KEY_ALIAS: calligrus
          CALLIGRUS_RELEASE_KEY_PASSWORD: ${{ secrets.CALLIGRUS_KEYSTORE_PASSWORD }}
        run: sh gradlew assembleRelease -PcalligrusAbis=arm64-v8a

      - name: Save vcpkg binary packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Name and verify the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "calligrus-${{ github.ref_name }}-android-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs calligrus-*-android-arm64.apk | tee "$RUNNER_TEMP/certs.txt"
          grep -q 'certificate DN' "$RUNNER_TEMP/certs.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: calligrus-*-android-arm64.apk
          if-no-files-found: error

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/calligrus-release.jks"

  release:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/calligrus-*-windows-x64.zip
            dist/calligrus-*-linux-x64.tar.gz
            dist/calligrus-*-android-arm64.apk
