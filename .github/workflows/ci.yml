name: CI

on:
  push:
  pull_request:

# The vcpkg binary cache is a plain folder that actions/cache saves and restores.
env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
  VCPKG_DISABLE_METRICS: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Restore here, save right after the build (below): a failing test must not throw away the
      # freshly built libraries (actions/cache would only save when the whole job succeeds).
      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-

      - name: Get vcpkg at the manifest baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git init $root
          git -C $root remote add origin https://github.com/microsoft/vcpkg
          git -C $root fetch --depth 1 origin $baseline
          git -C $root checkout FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build (Release, MSVC, x64-windows-static)
        shell: pwsh
        run: .\build.ps1

      - name: Save vcpkg binary packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Run the console tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem build\Release\calligrus-*-test.exe) {
            Write-Host "== $($t.Name)"
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }

      # The app needs OpenGL 3.3; the hosted Windows runners only have the GDI 1.1 driver, so
      # install Mesa's software renderer.
      - name: Software OpenGL (Mesa llvmpipe)
        if: hashFiles('spec/tests/visual/refs/windows/**') != ''
        uses: ssciwr/setup-mesa-dist-win@v2

      - name: Visual suite
        if: hashFiles('spec/tests/visual/refs/windows/**') != ''
        shell: pwsh
        run: |
          python -m pip install pillow pymupdf
          Set-Location spec\tests\visual
          python run.py

      - name: Visual suite skipped
        if: hashFiles('spec/tests/visual/refs/windows/**') == ''
        run: echo "No spec/tests/visual/refs/windows folder; the visual suite is skipped."

      - name: Upload the visual report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-windows
          path: |
            spec/tests/visual/report
            spec/tests/visual/out
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Restore here, save right after the build (below): a failing test must not throw away the
      # freshly built libraries (actions/cache would only save when the whole job succeeds).
      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl zip unzip tar pkg-config autoconf autoconf-archive automake libtool \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev \
            libxkbcommon-dev libwayland-dev libxext-dev \
            xvfb libgl1-mesa-dri python3-pip

      - name: Get vcpkg at the manifest baseline
        run: |
          mkdir -p .vcpkg-cache
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git init "$HOME/vcpkg"
          git -C "$HOME/vcpkg" remote add origin https://github.com/microsoft/vcpkg
          git -C "$HOME/vcpkg" fetch --depth 1 origin "$baseline"
          git -C "$HOME/vcpkg" checkout FETCH_HEAD
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Build (Release)
        run: bash build.sh

      - name: Save vcpkg binary packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Run the console tests
        run: |
          fail=0
          for t in build/calligrus-*-test; do
            echo "== $t"
            "$t" || fail=1
          done
          exit $fail

      - name: Visual suite
        run: |
          if [ -d spec/tests/visual/refs/linux ]; then
            python3 -m pip install pillow pymupdf
            cd spec/tests/visual
            python3 run.py --exe ../../../build/calligrus
          else
            echo "No spec/tests/visual/refs/linux folder; the visual suite is skipped."
          fi

      - name: Upload the visual report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-linux
          path: |
            spec/tests/visual/report
            spec/tests/visual/out
          if-no-files-found: ignore

  # The release APK (arm64-v8a), signed when the repository secrets are available (not for pull requests from
  # forks, which get none: those build the unsigned APK). Build only: no emulator, no tests.
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # `secrets` cannot be used in a step's `if:`, so look at it through a step-level env var. Nothing here
      # prints a value, and no step in this job uses `set -x`.
      - name: Decode the signing keystore (when the secrets exist)
        id: sign
        env:
          HAS_KEY: ${{ secrets.CALLIGRUS_KEYSTORE_B64 != '' }}
          KEYSTORE_B64: ${{ secrets.CALLIGRUS_KEYSTORE_B64 }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/calligrus-release.jks"
            chmod 600 "$RUNNER_TEMP/calligrus-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets in this run (a fork pull request?): building the unsigned APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Restore here, save right after the build (below), as in the other jobs.
      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}
          restore-keys: vcpkg-android-

      # The runner has an Android SDK; sdkmanager adds what the Gradle files pin (it skips what is installed).
      - name: Install Android SDK packages
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build git curl zip unzip tar pkg-config autoconf autoconf-archive automake libtool

      - name: Get vcpkg at the manifest baseline
        run: |
          mkdir -p .vcpkg-cache
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git init "$HOME/vcpkg"
          git -C "$HOME/vcpkg" remote add origin https://github.com/microsoft/vcpkg
          git -C "$HOME/vcpkg" fetch --depth 1 origin "$baseline"
          git -C "$HOME/vcpkg" checkout FETCH_HEAD
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      # The overlay triplets (cmake/triplets) are picked by CMakeLists.txt from the ABI. The signing variables
      # exist for this one step only (not in GITHUB_ENV). `sh gradlew`: the file is not stored executable.
      - name: Build (Release, arm64-v8a, signed)
        if: steps.sign.outputs.signed == 'true'
        working-directory: android
        env:
          CALLIGRUS_RELEASE_KEYSTORE: ${{ runner.temp }}/calligrus-release.jks
          CALLIGRUS_RELEASE_STORE_PASSWORD: ${{ secrets.CALLIGRUS_KEYSTORE_PASSWORD }}
          CALLIGRUS_RELEASE_KEY_ALIAS: calligrus
          CALLIGRUS_RELEASE_KEY_PASSWORD: ${{ secrets.CALLIGRUS_KEYSTORE_PASSWORD }}
        run: sh gradlew assembleRelease -PcalligrusAbis=arm64-v8a

      - name: Build (Release, arm64-v8a, unsigned)
        if: steps.sign.outputs.signed != 'true'
        working-directory: android
        run: sh gradlew assembleRelease -PcalligrusAbis=arm64-v8a

      - name: Save vcpkg binary packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Name the APK
        run: |
          mkdir -p dist
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/calligrus-${GITHUB_SHA::7}.apk"
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/calligrus-${GITHUB_SHA::7}-unsigned.apk"
          fi
          ls -l dist

      - name: Verify the signature
        if: steps.sign.outputs.signed == 'true'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/*.apk | tee "$RUNNER_TEMP/certs.txt"
          grep -q 'certificate DN' "$RUNNER_TEMP/certs.txt"

      - name: Upload the signed APK
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calligrus-android
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload the unsigned APK
        if: steps.sign.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calligrus-android-unsigned
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/calligrus-release.jks"
