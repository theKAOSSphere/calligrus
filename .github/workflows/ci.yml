name: CI

# Tags (v*) are the release workflow's business. Every run also packages the Windows zip, the Linux tar.gz and the
# Android APK the way a release ships them (artifacts calligrus-windows-x64, calligrus-linux-x64, calligrus-android,
# kept 90 days): release.yml reuses them for the tagged commit instead of building again.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# The libraries are downloaded by CMake (FetchContent, cmake/deps.cmake); the archives are kept in this folder, which
# actions/cache saves and restores.
env:
  CALLIGRUS_DOWNLOAD_DIR: ${{ github.workspace }}/.deps-cache

jobs:
  windows:
    runs-on: windows-latest
    # sccache (GitHub Actions cache backend) wraps the compiler; Ninja, because the Visual Studio generator ignores
    # the compiler launcher. The MSVC environment comes from the msvc-dev-cmd step below.
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      # Restore here, save right after the build (below): a failing test must not throw away the
      # freshly downloaded libraries (actions/cache would only save when the whole job succeeds).
      - name: Restore downloaded libraries
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps-cache
          key: deps-windows-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: deps-windows-

      - name: Compiler cache (sccache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: MSVC environment (for Ninja)
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      # Single-config Ninja build in build\Release: the executables land where the tests and the visual suite look.
      - name: Build (Release, MSVC, static, Ninja + sccache)
        shell: pwsh
        env:
          CALLIGRUS_COMPILER_LAUNCHER: sccache
        run: .\build.ps1 -Generator Ninja -BuildDir build\Release

      - name: Save downloaded libraries
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps-cache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Run the console tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem build\Release\calligrus-*-test.exe) {
            Write-Host "== $($t.Name)"
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }

      # The same folder layout as the release archive (the release renames the archive and its folder after the tag).
      - name: Package (as the release)
        shell: pwsh
        run: |
          $name = "calligrus-windows-x64"
          $dir = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force "$dir\fonts" | Out-Null
          Copy-Item build\Release\calligrus.exe $dir
          Copy-Item LICENSE, THIRD-PARTY.md $dir
          Copy-Item assets\fonts\*.txt "$dir\fonts"
          Copy-Item editors "$dir\editors" -Recurse
          Compress-Archive -Path $dir -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: calligrus-windows-x64
          path: calligrus-windows-x64.zip
          retention-days: 90
          if-no-files-found: error

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

      # The app needs OpenGL 3.3; the hosted Windows runners only have the GDI 1.1 driver, so
      # install Mesa's software renderer.
      - name: Software OpenGL (Mesa llvmpipe)
        if: hashFiles('spec/tests/visual/refs/windows/**') != ''
        uses: ssciwr/setup-mesa-dist-win@v2

      - name: Visual suite
        if: hashFiles('spec/tests/visual/refs/windows/**') != ''
        shell: pwsh
        run: |
          python -m pip install pillow pymupdf
          Set-Location spec\tests\visual
          python run.py

      - name: Visual suite skipped
        if: hashFiles('spec/tests/visual/refs/windows/**') == ''
        run: echo "No spec/tests/visual/refs/windows folder; the visual suite is skipped."

      - name: Upload the visual report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-windows
          path: |
            spec/tests/visual/report
            spec/tests/visual/out
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      CALLIGRUS_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4

      # Restore here, save right after the build (below): a failing test must not throw away the
      # freshly downloaded libraries (actions/cache would only save when the whole job succeeds).
      - name: Restore downloaded libraries
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps-cache
          key: deps-linux-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: deps-linux-

      - name: Compiler cache (sccache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libxext-dev \
            xvfb libgl1-mesa-dri python3-pip

      - name: Build (Release)
        run: bash build.sh

      - name: Save downloaded libraries
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps-cache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Run the console tests
        run: |
          fail=0
          for t in build/calligrus-*-test; do
            echo "== $t"
            "$t" || fail=1
          done
          exit $fail

      # The same folder layout as the release archive (the release renames the archive and its folder after the tag).
      - name: Package (as the release)
        run: |
          name="calligrus-linux-x64"
          mkdir -p "$name/fonts"
          cp build/calligrus LICENSE THIRD-PARTY.md "$name/"
          cp assets/fonts/*.txt "$name/fonts/"
          cp -r editors "$name/editors"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: calligrus-linux-x64
          path: calligrus-linux-x64.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

      - name: Visual suite
        run: |
          if [ -d spec/tests/visual/refs/linux ]; then
            python3 -m pip install pillow pymupdf
            cd spec/tests/visual
            python3 run.py --exe ../../../build/calligrus
          else
            echo "No spec/tests/visual/refs/linux folder; the visual suite is skipped."
          fi

      - name: Upload the visual report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-linux
          path: |
            spec/tests/visual/report
            spec/tests/visual/out
          if-no-files-found: ignore

  # The release APK (arm64-v8a), signed when the repository secrets are available (not for pull requests from
  # forks, which get none: those build the unsigned APK). Build only: no emulator, no tests.
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      SCCACHE_GHA_ENABLED: "true"
      CALLIGRUS_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # `secrets` cannot be used in a step's `if:`, so look at it through a step-level env var. Nothing here
      # prints a value, and no step in this job uses `set -x`.
      - name: Decode the signing keystore (when the secrets exist)
        id: sign
        env:
          HAS_KEY: ${{ secrets.CALLIGRUS_KEYSTORE_B64 != '' }}
          KEYSTORE_B64: ${{ secrets.CALLIGRUS_KEYSTORE_B64 }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/calligrus-release.jks"
            chmod 600 "$RUNNER_TEMP/calligrus-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets in this run (a fork pull request?): building the unsigned APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Restore here, save right after the build (below), as in the other jobs.
      - name: Restore downloaded libraries
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps-cache
          key: deps-android-${{ hashFiles('cmake/deps.cmake') }}
          restore-keys: deps-android-

      - name: Compiler cache (sccache)
        uses: mozilla-actions/sccache-action@v0.0.11

      # The runner has an Android SDK; sdkmanager adds what the Gradle files pin (it skips what is installed).
      - name: Install Android SDK packages
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      # The libraries are downloaded and built by CMake for the ABI. The signing variables
      # exist for this one step only (not in GITHUB_ENV). `sh gradlew`: the file is not stored executable.
      - name: Build (Release, arm64-v8a, signed)
        if: steps.sign.outputs.signed == 'true'
        working-directory: android
        env:
          CALLIGRUS_RELEASE_KEYSTORE: ${{ runner.temp }}/calligrus-release.jks
          CALLIGRUS_RELEASE_STORE_PASSWORD: ${{ secrets.CALLIGRUS_KEYSTORE_PASSWORD }}
          CALLIGRUS_RELEASE_KEY_ALIAS: calligrus
          CALLIGRUS_RELEASE_KEY_PASSWORD: ${{ secrets.CALLIGRUS_KEYSTORE_PASSWORD }}
        run: sh gradlew assembleRelease -PcalligrusAbis=arm64-v8a

      - name: Build (Release, arm64-v8a, unsigned)
        if: steps.sign.outputs.signed != 'true'
        working-directory: android
        run: sh gradlew assembleRelease -PcalligrusAbis=arm64-v8a

      - name: Save downloaded libraries
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps-cache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Name the APK
        run: |
          mkdir -p dist
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/calligrus-android-arm64.apk"
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/calligrus-android-arm64-unsigned.apk"
          fi
          ls -l dist

      - name: Verify the signature
        if: steps.sign.outputs.signed == 'true'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/calligrus-android-arm64.apk | tee "$RUNNER_TEMP/certs.txt"
          grep -q 'certificate DN' "$RUNNER_TEMP/certs.txt"

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Upload the signed APK
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calligrus-android
          path: dist/calligrus-android-arm64.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload the unsigned APK
        if: steps.sign.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: calligrus-android-unsigned
          path: dist/calligrus-android-arm64-unsigned.apk
          retention-days: 14
          if-no-files-found: error

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/calligrus-release.jks"
