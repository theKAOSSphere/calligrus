# Nord: after Nord by Arctic Ice Studio & Sven Greb, https://www.nordtheme.com
# (https://github.com/nordtheme/nord, MIT licence). Palette nord0..nord15; syntax follows
# Nord's own Visual Studio Code theme (https://github.com/nordtheme/visual-studio-code, MIT):
# nord9 keywords, nord14 strings, nord8 functions, nord7 types, nord15 numbers, comments in
# its brightened nord3 (#616e88). doc.weak is a derived blend (nord4 over nord0) because
# #616e88 is too dim for running text.
name = "nord"
display_name = "Nord"
dark = true

[ui]
panel = "#3b4252"
border = "#4c566a"
widget = "#434c5e"
widget_hover = "#4c566a"
widget_active = "#2e3440"
text = "#d8dee9"
weak = "#838994"
field = "#2e3440"
selection = "#4b6281"
selection_text = "#eceff4"
accent = "#88c0d0"

[doc]
bg = "#2e3440"
text = "#d8dee9"
weak = "#949aa5"
link = "#88c0d0"
heading = "#88c0d0"
# per level, as the Nord Neovim ports: nord9, nord15, nord14, nord13, nord12, nord11
heading_1 = "#81a1c1"
heading_2 = "#b48ead"
heading_3 = "#a3be8c"
heading_4 = "#ebcb8b"
heading_5 = "#d08770"
heading_6 = "#bf616a"
code_bg = "#3b4252"
code_border = "#434c5e"
code_fg = "#8fbcbb"
rule = "#4c566a"
quote_bar = "#616e88"
table_head_bg = "#3b4252"
zebra = "#333945"
error = "#bf616a"
find_match = "#495e6b"
find_current = "#7a705e"

[syntax]
comment = "#616e88"
keyword = "#81a1c1"
conditional = "#81a1c1"
repeat = "#81a1c1"
preproc = "#5e81ac"
"punctuation.special" = "#81a1c1"
special = "#81a1c1"
string = "#a3be8c"
"string.special" = "#ebcb8b"
"string.special.key" = "#8fbcbb"
"string.escape" = "#ebcb8b"
"string.regexp" = "#ebcb8b"
escape = "#ebcb8b"
character = "#ebcb8b"
number = "#b48ead"
boolean = "#81a1c1"
constant = "#81a1c1"
"constant.character" = "#ebcb8b"
"constant.character.escape" = "#ebcb8b"
function = "#88c0d0"
method = "#88c0d0"
"function.builtin" = "#88c0d0"
type = "#8fbcbb"
"type.builtin" = "#81a1c1"
constructor = "#8fbcbb"
module = "#8fbcbb"
namespace = "#8fbcbb"
label = "#81a1c1"
"variable.builtin" = "#81a1c1"
"variable.parameter" = "#d8dee9"
parameter = "#d8dee9"
"variable.other.member" = "#d8dee9"
property = "#d8dee9"
field = "#d8dee9"
tag = "#81a1c1"
attribute = "#8fbcbb"
"markup.heading" = "#88c0d0 bold"
"text.title" = "#88c0d0 bold"
"markup.raw" = "#8fbcbb"
"text.literal" = "#8fbcbb"
"markup.link.url" = "#88c0d0"
"text.uri" = "#88c0d0"
"markup.link.label" = "#88c0d0"
"text.reference" = "#88c0d0"
"markup.italic" = "#d8dee9 italic"
"markup.bold" = "#d8dee9 bold"
