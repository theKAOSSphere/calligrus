# calligrus Dark: the default dark look (neutral grey UI, base16-ocean code colours).
name = "calligrus-dark"
display_name = "Calligrus Dark"
dark = true

[ui]
panel = "#1b1b1b"
border = "#3c3c3c"
widget = "#3c3c3c"
widget_hover = "#464646"
widget_active = "#373737"
text = "#b4b4b4"
weak = "#5f5f5f"
field = "#0a0a0a"
selection = "#005c80"
selection_text = "#c0deff"
accent = "#5aa0ff"

[doc]
bg = "#1b1b1b"
text = "#e0e0e0"
weak = "#969696"
link = "#6ea8fe"
heading = "#e0e0e0"
code_bg = "#ffffff12"
code_border = "#ffffff14"
code_fg = "#ebbe8c"
rule = "#ffffff28"
quote_bar = "#ffffff50"
table_head_bg = "#ffffff1d"
zebra = "#ffffff08"
error = "#ff7878"
find_match = "#6b5a1e"
find_current = "#806410"

[syntax]
comment = "#65737e italic"
keyword = "#b48ead bold"
conditional = "#b48ead bold"
repeat = "#b48ead bold"
preproc = "#b48ead bold"
"punctuation.special" = "#96b5b4"
special = "#96b5b4"
string = "#a3be8c"
"string.special" = "#96b5b4"
"string.special.key" = "#bf616a"
"string.escape" = "#96b5b4"
"string.regexp" = "#96b5b4"
escape = "#96b5b4"
character = "#a3be8c"
number = "#d08770"
boolean = "#d08770"
constant = "#d08770"
"constant.character" = "#a3be8c"
"constant.character.escape" = "#96b5b4"
function = "#8fa1b3 bold"
method = "#8fa1b3 bold"
"function.builtin" = "#96b5b4"
type = "#ebcb8b bold"
"type.builtin" = "#b48ead"
constructor = "#ebcb8b"
module = "#ebcb8b"
namespace = "#ebcb8b"
label = "#d08770"
"variable.builtin" = "#bf616a"
"variable.parameter" = "#d08770"
parameter = "#d08770"
"variable.other.member" = "#bf616a"
property = "#bf616a"
field = "#bf616a"
tag = "#bf616a"
attribute = "#d08770"
"markup.heading" = "#8fa1b3 bold"
"text.title" = "#8fa1b3 bold"
"markup.raw" = "#a3be8c"
"text.literal" = "#a3be8c"
"markup.link.url" = "#96b5b4"
"text.uri" = "#96b5b4"
"markup.link.label" = "#d08770"
"text.reference" = "#d08770"
"markup.italic" = "#c0c5ce italic"
"markup.bold" = "#c0c5ce bold"
