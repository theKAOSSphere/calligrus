# Dracula: after Dracula by Zeno Rocha and contributors, https://draculatheme.com
# (spec: https://draculatheme.com/spec; https://github.com/dracula/visual-studio-code, MIT
# licence). Colours from the spec and the VS Code theme's src/dracula.yml (incl. its UI
# shades BGLighter/BGLight/BGDark/BGDarker); syntax follows that file: pink keywords, yellow
# strings, purple constants, green functions, italic cyan types, italic orange parameters,
# italic purple this/self. doc.weak is a derived blend because the comment colour #6272a4
# is dim for running text.
name = "dracula"
display_name = "Dracula"
dark = true

[ui]
panel = "#21222c"
border = "#191a21"
widget = "#343746"
widget_hover = "#424450"
widget_active = "#2a2c39"
text = "#f8f8f2"
weak = "#7886b0"
field = "#191a21"
selection = "#44475a"
selection_text = "#f8f8f2"
accent = "#bd93f9"

[doc]
bg = "#282a36"
text = "#f8f8f2"
weak = "#8f9abb"
link = "#8be9fd"
heading = "#bd93f9"
# per level, as Mofiqul/dracula.nvim: foreground, pink, cyan, green, purple, orange
heading_1 = "#f8f8f2"
heading_2 = "#ff79c6"
heading_3 = "#8be9fd"
heading_4 = "#50fa7b"
heading_5 = "#bd93f9"
heading_6 = "#ffb86c"
bold = "#ffb86c"             # Dracula spec: bold orange, italic yellow
italic = "#f1fa8c"
code_bg = "#21222c"
code_border = "#343746"
code_fg = "#50fa7b"
rule = "#44475a"
quote_bar = "#6272a4"
table_head_bg = "#343746"
zebra = "#2e303c"
error = "#ff5555"
find_match = "#5e4e44"
find_current = "#7e4a70"

[syntax]
comment = "#6272a4"
keyword = "#ff79c6"
conditional = "#ff79c6"
repeat = "#ff79c6"
preproc = "#ff79c6"
"punctuation.special" = "#ff79c6"
special = "#ff79c6"
string = "#f1fa8c"
"string.special" = "#f1fa8c"
"string.special.key" = "#8be9fd"
"string.escape" = "#ff79c6"
"string.regexp" = "#f1fa8c"
escape = "#ff79c6"
character = "#f1fa8c"
number = "#bd93f9"
boolean = "#bd93f9"
constant = "#bd93f9"
"constant.character" = "#f1fa8c"
"constant.character.escape" = "#ff79c6"
function = "#50fa7b"
method = "#50fa7b"
"function.builtin" = "#8be9fd"
type = "#8be9fd italic"
"type.builtin" = "#8be9fd italic"
constructor = "#8be9fd"
module = "#8be9fd italic"
namespace = "#8be9fd italic"
label = "#ff79c6"
"variable.builtin" = "#bd93f9 italic"
"variable.parameter" = "#ffb86c italic"
parameter = "#ffb86c italic"
"variable.other.member" = "#f8f8f2"
property = "#f8f8f2"
field = "#f8f8f2"
tag = "#ff79c6"
attribute = "#50fa7b italic"
"markup.heading" = "#bd93f9 bold"
"text.title" = "#bd93f9 bold"
"markup.raw" = "#50fa7b"
"text.literal" = "#50fa7b"
"markup.link.url" = "#8be9fd"
"text.uri" = "#8be9fd"
"markup.link.label" = "#ff79c6"
"text.reference" = "#ff79c6"
"markup.italic" = "#f1fa8c italic"
"markup.bold" = "#ffb86c bold"
