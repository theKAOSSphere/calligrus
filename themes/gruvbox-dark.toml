# Gruvbox Dark: after gruvbox by Pavel Pertsev (morhetz), https://github.com/morhetz/gruvbox
# (MIT licence). Palette from colors/gruvbox.vim (dark background, medium contrast: bg0 #282828,
# fg1 #ebdbb2, the bright_* accents); syntax follows its Vim groups: red keywords, green bold
# functions, purple constants, yellow types, aqua preprocessor, italic grey comments.
name = "gruvbox-dark"
display_name = "Gruvbox Dark"
dark = true

[ui]
panel = "#1d2021"
border = "#504945"
widget = "#3c3836"
widget_hover = "#504945"
widget_active = "#32302f"
text = "#d5c4a1"
weak = "#928374"
field = "#282828"
selection = "#665c54"
selection_text = "#fbf1c7"
accent = "#fabd2f"

[doc]
bg = "#282828"
text = "#ebdbb2"
weak = "#a89984"
link = "#83a598"
heading = "#b8bb26"
code_bg = "#32302f"
code_border = "#3c3836"
code_fg = "#8ec07c"
rule = "#504945"
quote_bar = "#665c54"
table_head_bg = "#3c3836"
zebra = "#2e2d2c"
error = "#fb4934"
find_match = "#5c4d2a"
find_current = "#824d22"

[syntax]
comment = "#928374 italic"
keyword = "#fb4934"
conditional = "#fb4934"
repeat = "#fb4934"
preproc = "#8ec07c"
"punctuation.special" = "#fe8019"
special = "#fe8019"
string = "#b8bb26"
"string.special" = "#8ec07c"
"string.special.key" = "#83a598"
"string.escape" = "#fe8019"
"string.regexp" = "#fe8019"
escape = "#fe8019"
character = "#d3869b"
number = "#d3869b"
boolean = "#d3869b"
constant = "#d3869b"
"constant.character" = "#d3869b"
"constant.character.escape" = "#fe8019"
function = "#b8bb26 bold"
method = "#b8bb26 bold"
"function.builtin" = "#fe8019"
type = "#fabd2f"
"type.builtin" = "#fabd2f"
constructor = "#fabd2f"
module = "#8ec07c"
namespace = "#8ec07c"
label = "#fb4934"
"variable.builtin" = "#fe8019"
"variable.parameter" = "#83a598"
parameter = "#83a598"
"variable.other.member" = "#83a598"
property = "#83a598"
field = "#83a598"
tag = "#8ec07c bold"
attribute = "#8ec07c"
"markup.heading" = "#b8bb26 bold"
"text.title" = "#b8bb26 bold"
"markup.raw" = "#8ec07c"
"text.literal" = "#8ec07c"
"markup.link.url" = "#d3869b"
"text.uri" = "#d3869b"
"markup.link.label" = "#a89984"
"text.reference" = "#a89984"
"markup.italic" = "#bdae93 italic"
"markup.bold" = "#ebdbb2 bold"
