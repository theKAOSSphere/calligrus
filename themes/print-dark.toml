# print-dark: a near-black page for dark PDFs, modelled on a browser print stylesheet:
# page #0b0b0b, text #e0e0e0, white headings, links #66ccff. The rest (UI, code,
# syntax) is calligrus Dark's, with its translucent shades kept so they sit on the darker page.
name = "print-dark"
display_name = "Print Dark"
dark = true

[ui]
panel = "#0b0b0b"
border = "#333333"
widget = "#2a2a2a"
widget_hover = "#363636"
widget_active = "#242424"
text = "#b4b4b4"
weak = "#5f5f5f"
field = "#050505"
selection = "#005c80"
selection_text = "#c0deff"
accent = "#66ccff"

[doc]
bg = "#0b0b0b"
text = "#e0e0e0"
weak = "#969696"
link = "#66ccff"
heading = "#ffffff"
code_bg = "#ffffff12"
code_border = "#ffffff14"
code_fg = "#ebbe8c"
rule = "#ffffff28"
quote_bar = "#ffffff50"
table_head_bg = "#ffffff1d"
zebra = "#ffffff08"
error = "#ff7878"
find_match = "#6b5a1e"
find_current = "#806410"

[syntax]
comment = "#65737e italic"
keyword = "#b48ead bold"
conditional = "#b48ead bold"
repeat = "#b48ead bold"
preproc = "#b48ead bold"
"punctuation.special" = "#96b5b4"
special = "#96b5b4"
string = "#a3be8c"
"string.special" = "#96b5b4"
"string.special.key" = "#bf616a"
"string.escape" = "#96b5b4"
"string.regexp" = "#96b5b4"
escape = "#96b5b4"
character = "#a3be8c"
number = "#d08770"
boolean = "#d08770"
constant = "#d08770"
"constant.character" = "#a3be8c"
"constant.character.escape" = "#96b5b4"
function = "#8fa1b3 bold"
method = "#8fa1b3 bold"
"function.builtin" = "#96b5b4"
type = "#ebcb8b bold"
"type.builtin" = "#b48ead"
constructor = "#ebcb8b"
module = "#ebcb8b"
namespace = "#ebcb8b"
label = "#d08770"
"variable.builtin" = "#bf616a"
"variable.parameter" = "#d08770"
parameter = "#d08770"
"variable.other.member" = "#bf616a"
property = "#bf616a"
field = "#bf616a"
tag = "#bf616a"
attribute = "#d08770"
"markup.heading" = "#8fa1b3 bold"
"text.title" = "#8fa1b3 bold"
"markup.raw" = "#a3be8c"
"text.literal" = "#a3be8c"
"markup.link.url" = "#96b5b4"
"text.uri" = "#96b5b4"
"markup.link.label" = "#d08770"
"text.reference" = "#d08770"
"markup.italic" = "#c0c5ce italic"
"markup.bold" = "#c0c5ce bold"
