# Tokyo Night: after Tokyo Night by enkia (https://github.com/enkia/tokyo-night-vscode-theme,
# MIT) in folke's port, https://github.com/folke/tokyonight.nvim (Apache-2.0), "night"
# style. Colours from lua/tokyonight/colors/{storm,night}.lua; syntax follows its base and
# treesitter groups: italic comments and keywords, magenta statements, green strings, orange
# constants, blue functions, blue1 types, yellow parameters, green1 properties. Selection is
# its bg_visual; find matches use bg_search (blue0), blended 70% over bg so the text stays readable.
name = "tokyo-night"
display_name = "Tokyo Night"
dark = true

[ui]
panel = "#16161e"
border = "#292e42"
widget = "#292e42"
widget_hover = "#3b4261"
widget_active = "#202230"
text = "#a9b1d6"
weak = "#737aa2"
field = "#0c0e14"
selection = "#283457"
selection_text = "#c0caf5"
accent = "#7aa2f7"

[doc]
bg = "#1a1b26"
text = "#c0caf5"
weak = "#737aa2"
link = "#7aa2f7"
heading = "#7aa2f7"
# per level, as folke/tokyonight.nvim: blue, yellow, green, teal, magenta, purple
heading_1 = "#7aa2f7"
heading_2 = "#e0af68"
heading_3 = "#9ece6a"
heading_4 = "#1abc9c"
heading_5 = "#bb9af7"
heading_6 = "#9d7cd8"
code_bg = "#16161e"
code_border = "#292e42"
code_fg = "#9ece6a"
rule = "#3b4261"
quote_bar = "#545c7e"
table_head_bg = "#292e42"
zebra = "#1f202c"
error = "#f7768e"
find_match = "#32467c"
find_current = "#7a5240"

[syntax]
comment = "#565f89 italic"
keyword = "#9d7cd8 italic"
conditional = "#bb9af7"
repeat = "#bb9af7"
preproc = "#7dcfff"
"punctuation.special" = "#89ddff"
special = "#2ac3de"
string = "#9ece6a"
"string.special" = "#2ac3de"
"string.special.key" = "#73daca"
"string.escape" = "#bb9af7"
"string.regexp" = "#b4f9f8"
escape = "#bb9af7"
character = "#9ece6a"
number = "#ff9e64"
boolean = "#ff9e64"
constant = "#ff9e64"
"constant.character" = "#9ece6a"
"constant.character.escape" = "#bb9af7"
function = "#7aa2f7"
method = "#7aa2f7"
"function.builtin" = "#2ac3de"
type = "#2ac3de"
"type.builtin" = "#27a1b9"
constructor = "#bb9af7"
module = "#7dcfff"
namespace = "#7dcfff"
label = "#7aa2f7"
"variable.builtin" = "#f7768e"
"variable.parameter" = "#e0af68"
parameter = "#e0af68"
"variable.other.member" = "#73daca"
property = "#73daca"
field = "#73daca"
tag = "#f7768e"
attribute = "#73daca"
"markup.heading" = "#7aa2f7 bold"
"text.title" = "#7aa2f7 bold"
"markup.raw" = "#9ece6a"
"text.literal" = "#9ece6a"
"markup.link.url" = "#1abc9c"
"text.uri" = "#1abc9c"
"markup.link.label" = "#2ac3de"
"text.reference" = "#2ac3de"
"markup.italic" = "#c0caf5 italic"
"markup.bold" = "#c0caf5 bold"
