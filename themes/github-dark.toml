# GitHub Dark: after "GitHub Dark Default" from GitHub's VS Code theme, https://github.com/primer/github-vscode-theme
# (MIT licence, (c) 2020 Primer), v6.3.5 (themes/dark-default.json), built on @primer/primitives 7.10.0
# (dark.json, MIT). Editor/UI colours from the theme JSON (fg.default #e6edf3, fg.muted #7d8590 and link
# #2f81f7 are the theme's own overrides); the doc view follows github.com's markdown body: canvas.default
# page, canvas.subtle code blocks and even table rows, border.default rules/quote bar/table lines, plain-text
# headings and inline code. Translucent primitives are flattened: selection = accent.muted, find match =
# attention.muted over canvas.default; current match = editor.findMatchBackground. Syntax = the theme's
# tokenColors (prettylights): red keywords, light-blue strings, blue constants, purple functions, orange types.
name = "github-dark"
display_name = "GitHub Dark"
dark = true

[ui]
panel = "#010409"
border = "#30363d"
widget = "#21262d"
widget_hover = "#30363d"
widget_active = "#282e33"
text = "#e6edf3"
weak = "#6e7681"
field = "#0d1117"
selection = "#1e4273"
selection_text = "#ffffff"
accent = "#1f6feb"

[doc]
bg = "#0d1117"
text = "#e6edf3"
weak = "#7d8590"
link = "#2f81f7"
heading = "#e6edf3"
code_bg = "#161b22"
code_border = "#30363d"
code_fg = "#e6edf3"
rule = "#30363d"
quote_bar = "#30363d"
table_head_bg = "#161b22"
zebra = "#161b22"
error = "#f85149"
find_match = "#533d11"
find_current = "#9e6a03"

[syntax]
comment = "#8b949e"
keyword = "#ff7b72"
conditional = "#ff7b72"
repeat = "#ff7b72"
preproc = "#ff7b72"
"punctuation.special" = "#ff7b72"
special = "#ff7b72"
string = "#a5d6ff"
"string.special" = "#79c0ff"
"string.special.key" = "#7ee787"
"string.escape" = "#79c0ff"
"string.regexp" = "#a5d6ff"
escape = "#79c0ff"
character = "#a5d6ff"
number = "#79c0ff"
boolean = "#79c0ff"
constant = "#79c0ff"
"constant.character" = "#ff7b72"
"constant.character.escape" = "#79c0ff"
function = "#d2a8ff"
method = "#d2a8ff"
"function.builtin" = "#79c0ff"
type = "#ffa657"
"type.builtin" = "#ff7b72"
constructor = "#ffa657"
module = "#ffa657"
namespace = "#ffa657"
label = "#79c0ff"
"variable.builtin" = "#79c0ff"
"variable.parameter" = "#ffa657"
parameter = "#ffa657"
"variable.other.member" = "#79c0ff"
property = "#79c0ff"
field = "#79c0ff"
tag = "#7ee787"
attribute = "#79c0ff"
"markup.heading" = "#79c0ff bold"
"text.title" = "#79c0ff bold"
"markup.raw" = "#79c0ff"
"text.literal" = "#79c0ff"
"markup.link.url" = "#a5d6ff"
"text.uri" = "#a5d6ff"
"markup.link.label" = "#a5d6ff"
"text.reference" = "#a5d6ff"
"markup.italic" = "#e6edf3 italic"
"markup.bold" = "#e6edf3 bold"
