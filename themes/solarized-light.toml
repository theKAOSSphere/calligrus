# Solarized Light: after Solarized by Ethan Schoonover, https://ethanschoonover.com/solarized
# (https://github.com/altercation/solarized, MIT licence). The 16 Solarized colours;
# syntax follows the original vim-colors-solarized groups: green statements/keywords, cyan
# constants and strings, blue identifiers/functions, yellow types, orange preprocessor and
# titles, red specials/escapes, violet links, italic base1 comments. Body text uses the
# "emphasised content" tone (base01 #586e75 on base3) for reading contrast; UI steps are blends of the palette.
name = "solarized-light"
display_name = "Solarized Light"
dark = false

[ui]
panel = "#eee8d5"
border = "#b7bdb6"
widget = "#d3d3c5"
widget_hover = "#c5c8be"
widget_active = "#b3bab3"
text = "#073642"
weak = "#93a1a1"
field = "#fdf6e3"
selection = "#c7dbdf"
selection_text = "#073642"
accent = "#268bd2"

[doc]
bg = "#fdf6e3"
text = "#586e75"
weak = "#657b83"
link = "#268bd2"
heading = "#cb4b16"
# per level, as the Solarized Neovim port: blue, violet, yellow, orange, red, magenta
heading_1 = "#268bd2"
heading_2 = "#6c71c4"
heading_3 = "#ad8200"   # yellow, a shade darker: #b58900 is 2.98:1 on base3 (minimum 3:1)
heading_4 = "#cb4b16"
heading_5 = "#dc322f"
heading_6 = "#d33682"
code_bg = "#eee8d5"
code_border = "#caccc0"
code_fg = "#d33682"   # magenta: the ports use cyan, but cyan on base2 is only 2.6:1 (spec minimum 3:1)
rule = "#c8ccc2"
quote_bar = "#93a1a1"
table_head_bg = "#eee8d5"
zebra = "#f6efdc"
error = "#dc322f"
find_match = "#f6ebcc"
find_current = "#eec3a5"

[syntax]
comment = "#93a1a1 italic"
keyword = "#859900"
conditional = "#859900"
repeat = "#859900"
preproc = "#cb4b16"
"punctuation.special" = "#dc322f"
special = "#dc322f"
string = "#2aa198"
"string.special" = "#dc322f"
"string.special.key" = "#268bd2"
"string.escape" = "#dc322f"
"string.regexp" = "#dc322f"
escape = "#dc322f"
character = "#2aa198"
number = "#2aa198"
boolean = "#2aa198"
constant = "#2aa198"
"constant.character" = "#2aa198"
"constant.character.escape" = "#dc322f"
function = "#268bd2"
method = "#268bd2"
"function.builtin" = "#268bd2"
type = "#b58900"
"type.builtin" = "#b58900"
constructor = "#b58900"
module = "#cb4b16"
namespace = "#cb4b16"
label = "#859900"
"variable.builtin" = "#cb4b16"
"variable.parameter" = "#268bd2"
parameter = "#268bd2"
"variable.other.member" = "#268bd2"
property = "#268bd2"
field = "#268bd2"
tag = "#268bd2"
attribute = "#b58900"
"markup.heading" = "#cb4b16 bold"
"text.title" = "#cb4b16 bold"
"markup.raw" = "#2aa198"
"text.literal" = "#2aa198"
"markup.link.url" = "#6c71c4"
"text.uri" = "#6c71c4"
"markup.link.label" = "#6c71c4"
"text.reference" = "#6c71c4"
"markup.italic" = "#586e75 italic"
"markup.bold" = "#586e75 bold"
