# Catppuccin Mocha: after Catppuccin, https://catppuccin.com (palette:
# https://github.com/catppuccin/palette, MIT licence). Colours from palette.json ("mocha");
# syntax follows catppuccin/nvim (MIT): mauve keywords (italic conditionals/loops), green
# strings, pink escapes, peach numbers, blue functions, yellow types, maroon parameters,
# lavender fields, italic overlay2 comments. Search colours follow its Search group
# (sky darkened towards base).
name = "catppuccin-mocha"
display_name = "Catppuccin Mocha"
dark = true

[ui]
panel = "#181825"
border = "#313244"
widget = "#313244"
widget_hover = "#45475a"
widget_active = "#272838"
text = "#bac2de"
weak = "#7f849c"
field = "#11111b"
selection = "#585b70"
selection_text = "#cdd6f4"
accent = "#b4befe"

[doc]
bg = "#1e1e2e"
text = "#cdd6f4"
weak = "#a6adc8"
link = "#89b4fa"
heading = "#89b4fa"   # outline and fallback; catppuccin/nvim @markup.heading blue
# per level, as catppuccin/nvim and the VS Code theme: red, peach, yellow, green, sapphire, lavender
heading_1 = "#f38ba8"
heading_2 = "#fab387"
heading_3 = "#f9e2af"
heading_4 = "#a6e3a1"
heading_5 = "#74c7ec"
heading_6 = "#b4befe"
code_bg = "#181825"
code_border = "#313244"
code_fg = "#a6e3a1"
rule = "#45475a"
quote_bar = "#585b70"
table_head_bg = "#313244"
zebra = "#232434"
error = "#f38ba8"
find_match = "#3e5767"
find_current = "#7a5d53"

[syntax]
comment = "#9399b2 italic"
keyword = "#cba6f7"
conditional = "#cba6f7 italic"
repeat = "#cba6f7 italic"
preproc = "#f5c2e7"
"punctuation.special" = "#f5c2e7"
special = "#f5c2e7"
string = "#a6e3a1"
"string.special" = "#f5c2e7"
"string.special.key" = "#89b4fa"
"string.escape" = "#f5c2e7"
"string.regexp" = "#f5c2e7"
escape = "#f5c2e7"
character = "#94e2d5"
number = "#fab387"
boolean = "#fab387"
constant = "#fab387"
"constant.character" = "#94e2d5"
"constant.character.escape" = "#f5c2e7"
function = "#89b4fa"
method = "#89b4fa"
"function.builtin" = "#fab387"
type = "#f9e2af"
"type.builtin" = "#cba6f7"
constructor = "#f9e2af"
module = "#f9e2af italic"
namespace = "#f9e2af italic"
label = "#74c7ec"
"variable.builtin" = "#f38ba8"
"variable.parameter" = "#eba0ac"
parameter = "#eba0ac"
"variable.other.member" = "#b4befe"
property = "#b4befe"
field = "#b4befe"
tag = "#89b4fa"
attribute = "#f9e2af italic"
"markup.heading" = "#89b4fa bold"
"text.title" = "#89b4fa bold"
"markup.raw" = "#a6e3a1"
"text.literal" = "#a6e3a1"
"markup.link.url" = "#89b4fa italic"
"text.uri" = "#89b4fa italic"
"markup.link.label" = "#b4befe"
"text.reference" = "#b4befe"
"markup.italic" = "#f38ba8 italic"
"markup.bold" = "#f38ba8 bold"
