# Leuven: a calm light theme after Emacs' leuven-theme, with custom modifications
# to its palette (backgrounds #f8f8f8 / #ededed / #e2e2e2, text #1a1a1a / #4d4d4d /
# #737373, accents blue #0050a0, green #008000, orange #d06000, teal #006d6d,
# red #c01010). Code colours follow leuven's spirit: blue keywords, green
# strings, grey italic comments.
name = "leuven"
display_name = "Leuven"
dark = false

[ui]
panel = "#ededed"
border = "#949494"
widget = "#e2e2e2"
widget_hover = "#d6d6d6"
widget_active = "#c7c7c7"
text = "#1a1a1a"
weak = "#737373"
field = "#ffffff"
selection = "#b3d1f0"
selection_text = "#0050a0"
accent = "#0050a0"

[doc]
bg = "#f8f8f8"
text = "#1a1a1a"
weak = "#4d4d4d"
link = "#0050a0"
heading = "#0050a0"
code_bg = "#e2e2e2"
code_border = "#c7c7c7"
code_fg = "#006d6d"
rule = "#c7c7c7"
quote_bar = "#949494"
table_head_bg = "#e2e2e2"
zebra = "#efefef"
error = "#c01010"
find_match = "#fff2a8"
find_current = "#ffcc4d"

[syntax]
comment = "#8d8d84 italic"
keyword = "#0000ff bold"
conditional = "#0000ff bold"
repeat = "#0000ff bold"
preproc = "#6434a3"
"punctuation.special" = "#d06000"
special = "#d06000"
string = "#008000"
"string.special" = "#006d6d"
"string.special.key" = "#0050a0"
"string.escape" = "#d06000"
"string.regexp" = "#d06000"
escape = "#d06000"
character = "#008000"
number = "#d06000"
boolean = "#d06000"
constant = "#d06000"
"constant.character" = "#008000"
"constant.character.escape" = "#d06000"
function = "#006699 bold"
method = "#006699"
"function.builtin" = "#006699"
type = "#006d6d bold"
"type.builtin" = "#006d6d"
constructor = "#006d6d"
module = "#6434a3"
namespace = "#6434a3"
label = "#d06000"
"variable.builtin" = "#c01010"
"variable.parameter" = "#4d4d4d"
parameter = "#4d4d4d"
"variable.other.member" = "#0050a0"
property = "#0050a0"
field = "#0050a0"
tag = "#0050a0"
attribute = "#006d6d"
"markup.heading" = "#0050a0 bold"
"text.title" = "#0050a0 bold"
"markup.raw" = "#008000"
"text.literal" = "#008000"
"markup.link.url" = "#006699"
"text.uri" = "#006699"
"markup.link.label" = "#6434a3"
"text.reference" = "#6434a3"
"markup.italic" = "#1a1a1a italic"
"markup.bold" = "#1a1a1a bold"
