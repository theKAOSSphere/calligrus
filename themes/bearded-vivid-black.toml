# Bearded Vivid Black: after "Bearded Theme Vivid Black" by BeardedBear,
# https://github.com/BeardedBear/bearded-theme (GPL-3.0 licence). Colours from the theme's
# source (src/variations/vivid.ts: base #141417, primary #AAAAAA, the vivid accents) and its
# generated Zed theme (dist/zed/themes/bearded-theme.json) for the UI shades and the syntax
# mapping (yellow keywords, green strings, red constants, blue functions, purple types,
# italic comments). Derived values (selection, find, rules) are blends of those colours.
name = "bearded-vivid-black"
display_name = "Bearded Vivid Black"
dark = true

[ui]
panel = "#0f0f11"
border = "#27272c"
widget = "#222227"
widget_hover = "#27272c"
widget_active = "#1b1b1f"
text = "#c5c5cb"
weak = "#808091"
field = "#09090b"
selection = "#3a3a3c"
selection_text = "#e0e0e3"
accent = "#28a9ff"

[doc]
bg = "#141417"
text = "#c5c5cb"
weak = "#808091"
link = "#28a9ff"
heading = "#ffb638"
code_bg = "#1b1b1f"
code_border = "#27272c"
code_fg = "#a95eff"   # purple, as the theme's own ports colour Markdown code
rule = "#2f2f32"
quote_bar = "#49494d"
table_head_bg = "#202025"
zebra = "#19191c"
error = "#de5757"
find_match = "#4f3c1f"
find_current = "#773b24"

[syntax]
comment = "#50505a italic"
keyword = "#ffb638"
conditional = "#ffb638"
repeat = "#ffb638"
preproc = "#ffb638"
"punctuation.special" = "#ff7135"
special = "#ff7135"
string = "#42dd76"
"string.special" = "#b7d175"
"string.special.key" = "#ff478d"
"string.escape" = "#ff7135"
"string.regexp" = "#ff7135"
escape = "#ff7135"
character = "#d62c2c"
number = "#d62c2c"
boolean = "#d62c2c"
constant = "#d62c2c"
"constant.character" = "#d62c2c"
"constant.character.escape" = "#ff7135"
function = "#28a9ff"
method = "#28a9ff"
"function.builtin" = "#28a9ff"
type = "#a95eff"
"type.builtin" = "#a95eff"
constructor = "#b7d175"
module = "#b7d175"
namespace = "#b7d175"
label = "#ffb638"
"variable.builtin" = "#ff478d"
"variable.parameter" = "#e66dff"
parameter = "#e66dff"
"variable.other.member" = "#c5c5cb"
property = "#c5c5cb"
field = "#c5c5cb"
tag = "#28a9ff"
attribute = "#ffb638"
"markup.heading" = "#ffb638 bold"
"text.title" = "#ffb638 bold"
"markup.raw" = "#a95eff"
"text.literal" = "#a95eff"
"markup.link.url" = "#28a9ff"
"text.uri" = "#28a9ff"
"markup.link.label" = "#28a9ff"
"text.reference" = "#28a9ff"
"markup.italic" = "#ff7135 italic"
"markup.bold" = "#ff478d bold"
