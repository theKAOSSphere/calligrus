# calligrus Light: the default light look (light grey UI, InspiredGitHub-like code colours).
name = "calligrus-light"
display_name = "Calligrus Light"
dark = false

[ui]
panel = "#f8f8f8"
border = "#bebebe"
widget = "#e6e6e6"
widget_hover = "#dcdcdc"
widget_active = "#a5a5a5"
text = "#3c3c3c"
weak = "#939393"
field = "#ffffff"
selection = "#90d1ff"
selection_text = "#00537d"
accent = "#0969da"

[doc]
bg = "#f8f8f8"
text = "#1c1c20"
weak = "#696969"
link = "#0969da"
heading = "#1c1c20"
code_bg = "#0000000e"
code_border = "#00000014"
code_fg = "#a03c1e"
rule = "#00000028"
quote_bar = "#00000050"
table_head_bg = "#00000016"
zebra = "#00000006"
error = "#c81e1e"
find_match = "#fff3a0"
find_current = "#ffc94a"

[syntax]
comment = "#969896 italic"
keyword = "#a71d5d bold"
conditional = "#a71d5d bold"
repeat = "#a71d5d bold"
preproc = "#a71d5d bold"
"punctuation.special" = "#0086b3"
special = "#a71d5d"
string = "#183691"
"string.special" = "#0086b3"
"string.special.key" = "#4b69c6"
"string.escape" = "#0086b3"
"string.regexp" = "#0086b3"
escape = "#0086b3"
character = "#183691"
number = "#0086b3"
boolean = "#0086b3"
constant = "#0086b3"
"constant.character" = "#183691"
"constant.character.escape" = "#0086b3"
function = "#795da3 bold"
method = "#795da3 bold"
"function.builtin" = "#62a35c"
type = "#445588 bold"
"type.builtin" = "#a71d5d"
constructor = "#445588"
module = "#445588"
namespace = "#445588"
label = "#0086b3"
"variable.builtin" = "#ed6a43"
"variable.parameter" = "#e36209"
parameter = "#e36209"
"variable.other.member" = "#4b69c6"
property = "#4b69c6"
field = "#4b69c6"
tag = "#63a35c"
attribute = "#795da3"
"markup.heading" = "#1d3e81 bold"
"text.title" = "#1d3e81 bold"
"markup.raw" = "#183691"
"text.literal" = "#183691"
"markup.link.url" = "#0086b3"
"text.uri" = "#0086b3"
"markup.link.label" = "#795da3"
"text.reference" = "#795da3"
"markup.italic" = "#333333 italic"
"markup.bold" = "#333333 bold"
