# Solarized Dark: after Solarized by Ethan Schoonover, https://ethanschoonover.com/solarized
# (https://github.com/altercation/solarized, MIT licence). The 16 Solarized colours;
# syntax follows the original vim-colors-solarized groups: green statements/keywords, cyan
# constants and strings, blue identifiers/functions, yellow types, orange preprocessor and
# titles, red specials/escapes, violet links, italic base01 comments. Body text uses the
# "emphasised content" tone (base1 #93a1a1 on base03) for reading contrast; UI steps are blends of the palette.
name = "solarized-dark"
display_name = "Solarized Dark"
dark = true

[ui]
panel = "#073642"
border = "#385861"
widget = "#234a54"
widget_hover = "#34555e"
widget_active = "#17414c"
text = "#93a1a1"
weak = "#657b83"
field = "#002b36"
selection = "#11567c"
selection_text = "#fdf6e3"
accent = "#268bd2"

[doc]
bg = "#002b36"
text = "#93a1a1"
weak = "#657b83"
link = "#268bd2"
heading = "#cb4b16"
# per level, as the Solarized Neovim port: blue, violet, yellow, orange, red, magenta
heading_1 = "#268bd2"
heading_2 = "#6c71c4"
heading_3 = "#b58900"
heading_4 = "#cb4b16"
heading_5 = "#dc322f"
heading_6 = "#d33682"
code_bg = "#073642"
code_border = "#274c56"
code_fg = "#2aa198"
rule = "#35535c"
quote_bar = "#586e75"
table_head_bg = "#073642"
zebra = "#04303c"
error = "#dc322f"
find_match = "#1b392e"
find_current = "#663b26"

[syntax]
comment = "#586e75 italic"
keyword = "#859900"
conditional = "#859900"
repeat = "#859900"
preproc = "#cb4b16"
"punctuation.special" = "#dc322f"
special = "#dc322f"
string = "#2aa198"
"string.special" = "#dc322f"
"string.special.key" = "#268bd2"
"string.escape" = "#dc322f"
"string.regexp" = "#dc322f"
escape = "#dc322f"
character = "#2aa198"
number = "#2aa198"
boolean = "#2aa198"
constant = "#2aa198"
"constant.character" = "#2aa198"
"constant.character.escape" = "#dc322f"
function = "#268bd2"
method = "#268bd2"
"function.builtin" = "#268bd2"
type = "#b58900"
"type.builtin" = "#b58900"
constructor = "#b58900"
module = "#cb4b16"
namespace = "#cb4b16"
label = "#859900"
"variable.builtin" = "#cb4b16"
"variable.parameter" = "#268bd2"
parameter = "#268bd2"
"variable.other.member" = "#268bd2"
property = "#268bd2"
field = "#268bd2"
tag = "#268bd2"
attribute = "#b58900"
"markup.heading" = "#cb4b16 bold"
"text.title" = "#cb4b16 bold"
"markup.raw" = "#2aa198"
"text.literal" = "#2aa198"
"markup.link.url" = "#6c71c4"
"text.uri" = "#6c71c4"
"markup.link.label" = "#6c71c4"
"text.reference" = "#6c71c4"
"markup.italic" = "#93a1a1 italic"
"markup.bold" = "#93a1a1 bold"
