# GitHub Light: after "GitHub Light Default" from GitHub's VS Code theme, https://github.com/primer/github-vscode-theme
# (MIT licence, (c) 2020 Primer), v6.3.5 (themes/light-default.json), built on @primer/primitives 7.10.0
# (light.json, MIT). Editor/UI colours from the theme JSON (fg.default #1f2328 and fg.muted #656d76 are the
# theme's own overrides; buttons = button.secondaryBackground / secondaryHoverBackground, pressed =
# border.muted); the doc view follows github.com's markdown body: white page, canvas.subtle code blocks and
# even table rows, border.default rules/quote bar/table lines, plain-text headings and inline code.
# Translucent primitives are flattened over white: selection = accent.muted, find match = attention.muted;
# current match = editor.findMatchBackground. Syntax = the theme's tokenColors (prettylights).
name = "github-light"
display_name = "GitHub Light"
dark = false

[ui]
panel = "#f6f8fa"
border = "#d0d7de"
widget = "#ebecf0"
widget_hover = "#f3f4f6"
widget_active = "#d8dee4"
text = "#1f2328"
weak = "#6e7781"
field = "#ffffff"
selection = "#bbdfff"
selection_text = "#1f2328"
accent = "#0969da"

[doc]
bg = "#ffffff"
text = "#1f2328"
weak = "#656d76"
link = "#0969da"
heading = "#1f2328"
code_bg = "#f6f8fa"
code_border = "#d0d7de"
code_fg = "#1f2328"
rule = "#d0d7de"
quote_bar = "#d0d7de"
table_head_bg = "#f6f8fa"
zebra = "#f6f8fa"
error = "#cf222e"
find_match = "#eedcab"
find_current = "#bf8700"

[syntax]
comment = "#6e7781"
keyword = "#cf222e"
conditional = "#cf222e"
repeat = "#cf222e"
preproc = "#cf222e"
"punctuation.special" = "#cf222e"
special = "#cf222e"
string = "#0a3069"
"string.special" = "#0550ae"
"string.special.key" = "#116329"
"string.escape" = "#0550ae"
"string.regexp" = "#0a3069"
escape = "#0550ae"
character = "#0a3069"
number = "#0550ae"
boolean = "#0550ae"
constant = "#0550ae"
"constant.character" = "#cf222e"
"constant.character.escape" = "#0550ae"
function = "#8250df"
method = "#8250df"
"function.builtin" = "#0550ae"
type = "#953800"
"type.builtin" = "#cf222e"
constructor = "#953800"
module = "#953800"
namespace = "#953800"
label = "#0550ae"
"variable.builtin" = "#0550ae"
"variable.parameter" = "#953800"
parameter = "#953800"
"variable.other.member" = "#0550ae"
property = "#0550ae"
field = "#0550ae"
tag = "#116329"
attribute = "#0550ae"
"markup.heading" = "#0550ae bold"
"text.title" = "#0550ae bold"
"markup.raw" = "#0550ae"
"text.literal" = "#0550ae"
"markup.link.url" = "#0a3069"
"text.uri" = "#0a3069"
"markup.link.label" = "#0a3069"
"text.reference" = "#0a3069"
"markup.italic" = "#1f2328 italic"
"markup.bold" = "#1f2328 bold"
